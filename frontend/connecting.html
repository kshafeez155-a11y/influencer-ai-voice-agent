<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Connecting — TAC Voice</title>
<link rel="stylesheet" href="styles.css"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{"surface-container-lowest":"#120e08","surface-container-low":"#1f1b15","surface-container":"#241f19","surface-container-high":"#2e2923","surface-container-highest":"#39342d","surface":"#17130d","surface-dim":"#17130d","surface-bright":"#3e3831","surface-variant":"#39342d","on-surface":"#ebe1d7","on-surface-variant":"#cbc6bc","on-background":"#ebe1d7","background":"#17130d","primary":"#ffffff","on-primary":"#32302b","primary-container":"#e7e2da","on-primary-container":"#67645e","secondary":"#ffb4a2","on-secondary":"#611200","secondary-container":"#ff562a","on-secondary-container":"#550f00","tertiary":"#ffffff","outline":"#949088","outline-variant":"#49473f","error":"#ffb4ab","inverse-surface":"#ebe1d7","inverse-on-surface":"#353029"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"stack-sm":"8px","stack-md":"24px","stack-lg":"64px","margin-main":"40px",gutter:"16px"},fontFamily:{"body-md":["Inter Tight"],"display-xl":["Instrument Serif"],"headline-lg":["Instrument Serif"],"headline-lg-mobile":["Instrument Serif"],"display-xl-mobile":["Instrument Serif"],"label-mono":["JetBrains Mono"]},fontSize:{"body-md":["15px",{lineHeight:"24px",letterSpacing:"0em",fontWeight:"400"}],"display-xl":["80px",{lineHeight:"88px",letterSpacing:"-0.02em",fontWeight:"400"}],"label-mono":["13px",{lineHeight:"16px",letterSpacing:"0.04em",fontWeight:"500"}],"headline-lg":["48px",{lineHeight:"56px",letterSpacing:"-0.02em",fontWeight:"400"}],"display-xl-mobile":["48px",{lineHeight:"52px",letterSpacing:"-0.02em",fontWeight:"400"}],"headline-lg-mobile":["32px",{lineHeight:"36px",letterSpacing:"-0.02em",fontWeight:"400"}]}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body data-page="connecting" class="bg-surface-container-lowest font-body-md text-on-surface antialiased">
<main class="min-h-screen w-full flex flex-col items-center justify-center relative overflow-hidden">
<div class="flex flex-col w-full h-full justify-between pb-margin-main px-margin-main relative" style="min-height: 100vh;">

<div class="grid grid-cols-12 gap-gutter flex-grow">
<div class="col-span-10 col-start-2 pt-[160px] flex flex-col justify-start relative z-10">
<!-- Name -->
<div class="font-headline-lg text-primary text-[96px] leading-[96px] tracking-[-0.02em]">
<span id="connecting-name">...</span>
</div>
<!-- Phone Number -->
<div class="mt-stack-sm font-label-mono text-outline uppercase tracking-[0.04em] text-[13px] leading-[16px]">
<span id="connecting-phone">+1 555 •••• 567</span>
</div>
</div>
<!-- Decorative horizontal line -->
<div class="col-span-4 col-start-9 absolute right-margin-main top-[240px] w-full max-w-[calc(33.333vw-32px)] flex items-center h-[96px] z-0">
<div class="w-full h-[1px] bg-[#2A2620]"></div>
</div>
</div>

<!-- Bottom Controls -->
<div class="grid grid-cols-12 gap-gutter mt-auto pt-margin-main border-t border-[#2A2620]">
<!-- Pipeline Status -->
<div class="col-span-8 flex items-center font-label-mono text-[13px] uppercase tracking-[0.04em]">
<span class="text-[#FF4D1C]">CONNECTING</span>
<span class="mx-2 text-[#6B645C]">&rarr;</span>
<span class="text-[#6B645C]">RINGING</span>
<span class="mx-2 text-[#6B645C]">&rarr;</span>
<span class="text-[#6B645C]">CONNECTED</span>
</div>
<!-- Timer & Cancel -->
<div class="col-span-4 flex justify-between items-center font-label-mono text-[13px] uppercase tracking-[0.04em]">
<span class="text-primary" id="call-timer">00:00</span>
<button class="text-[#6B645C] hover:text-primary transition-colors underline bg-transparent border-none cursor-pointer p-0 m-0">CANCEL</button>
</div>
</div>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const timerElement = document.getElementById('call-timer');
    let seconds = 0;

    setInterval(() => {
        seconds++;
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = (seconds % 60).toString().padStart(2, '0');
        timerElement.textContent = `${mins}:${secs}`;
    }, 1000);
});
</script>
</main>
<script src="app.js"></script>
</body>
</html>
