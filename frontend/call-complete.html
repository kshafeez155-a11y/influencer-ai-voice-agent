<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How was your call? — TAC Voice</title><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="public.css"></head><body data-public-page="call-complete"><header class="site-header"><div class="shell nav-shell"><a class="wordmark" href="index.html">tac</a><a class="nav-action" href="influencers.html">Call someone else</a></div></header><main id="main" class="state-page shell"><div class="state-card"><p class="section-context">Welcome back</p><h1>How was the call?</h1><p>Quick feedback helps make conversations less robotic and more useful. For safety or rights concerns, use the <a class="text-link" href="report.html">report form</a>.</p><form class="public-submission-form" data-kind="call_feedback"><div class="rating-row" aria-label="Rate your call from 1 to 5"><button type="button" data-rating="1" aria-pressed="false">1</button><button type="button" data-rating="2" aria-pressed="false">2</button><button type="button" data-rating="3" aria-pressed="false">3</button><button type="button" data-rating="4" aria-pressed="false">4</button><button type="button" data-rating="5" aria-pressed="false">5</button></div><input id="feedback-subject" name="subject" type="hidden" value="Not rated"><div class="field"><label for="feedback-email">Email</label><input id="feedback-email" name="email" type="email" maxlength="254" required></div><div class="field"><label for="feedback-message">One thing we should improve</label><textarea id="feedback-message" name="message" maxlength="5000" required></textarea></div><button class="button button-primary" type="submit">Send feedback</button><p class="form-result" role="status"></p></form></div></main><script src="site-pages.js"></script></body></html>
